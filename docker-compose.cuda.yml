services:
  infer:
    build:
      context: .
      dockerfile: Dockerfile.cuda
      args:
        CRATES_MIRROR: ${CRATES_MIRROR:-}
        CUDA_VERSION: ${CUDA_VERSION:-12.6.3}
    image: nexllama/infer-daemon:cuda
    ports:
      - "${PORT:-8090}:8090"
    volumes:
      - "${MODELS_DIR:-./models}:/models:ro"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8090"
      - "--model"
      - "${MODEL:-/models/model.gguf}"
      - "--n-gpu-layers"
      - "${N_GPU_LAYERS:-999}"
      - "--n-ctx"
      - "${N_CTX:-4096}"
      - "--keep-alive-secs"
      - "${KEEP_ALIVE_SECS:-0}"
      # The daemon refuses to listen on 0.0.0.0 without a token. Set API_KEY
      # below and drop this flag once the port is reachable beyond localhost.
      - "--allow-unauthenticated"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
