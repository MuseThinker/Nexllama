# The whole app on one port: `docker compose up web`, then http://localhost:8090.
#
# This is the web image rather than the API-only one: the daemon serves the
# built UI from `--ui-dir` and the API from the same port, so there is no
# second container to reverse-proxy, no CORS to configure, and no token to
# forward between them.
#
#   PORT=8090 MODELS_DIR=./models docker compose -f docker-compose.web.yml up web
#
# On a network anyone can reach, set API_KEY. The daemon reads it from
# NEXLLAMA_API_KEY, then every route but /health needs
# `Authorization: Bearer <API_KEY>`, and the app's Settings page is where it
# gets pasted:
#
#   API_KEY=$(openssl rand -hex 16) docker compose -f docker-compose.web.yml up web
#
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        CRATES_MIRROR: ${CRATES_MIRROR:-}
    image: nexllama/nexllama:web
    ports:
      - "${PORT:-8090}:8090"
    volumes:
      # Read-only: the app lists and loads from here, and a model folder that
      # anything in the container can rewrite is a model folder you cannot trust.
      - "${MODELS_DIR:-./models}:/models:ro"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      # Empty means no token, which is right on a laptop and wrong on a network.
      NEXLLAMA_API_KEY: ${API_KEY:-}
    restart: unless-stopped
    # For the GPU, swap `build.dockerfile` to Dockerfile.web.cuda and run with
    # `--gpus all` (see the README); `N_GPU_LAYERS=999` then offloads everything.

  web-cuda:
    profiles: ["cuda"]
    build:
      context: .
      dockerfile: Dockerfile.web.cuda
      args:
        CRATES_MIRROR: ${CRATES_MIRROR:-}
    image: nexllama/nexllama:web-cuda
    ports:
      - "${PORT:-8090}:8090"
    volumes:
      - "${MODELS_DIR:-./models}:/models:ro"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      NEXLLAMA_API_KEY: ${API_KEY:-}
    restart: unless-stopped