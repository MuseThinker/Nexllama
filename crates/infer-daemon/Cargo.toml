[package]
name = "infer-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "infer-daemon"
path = "src/main.rs"

[dependencies]
infer-core = { path = "../infer-core" }
model-index = { path = "../model-index" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors", "limit", "fs"] }
# Proxying cloud providers on the same port as the local engine. rustls so the
# container needs no system CA bundle wired up. `http2` for multiplexed upstream
# calls; system-proxy stays off so a host proxy does not slow a direct provider.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[target.'cfg(unix)'.dependencies]
# `getppid`, for the parent watchdog: there is no job object outside Windows.
libc = "0.2"

[features]
default = []
cuda = ["infer-core/cuda"]
vulkan = ["infer-core/vulkan"]
metal = ["infer-core/metal"]
native = ["infer-core/native"]
