services:
  infer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CRATES_MIRROR: ${CRATES_MIRROR:-}
        FEATURES: ${FEATURES:-}
    image: nexllama/infer-daemon:latest
    ports:
      - "${PORT:-8090}:8090"
    volumes:
      - "${MODELS_DIR:-./models}:/models:ro"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8090"
      - "--model"
      - "${MODEL:-/models/model.gguf}"
      - "--n-gpu-layers"
      - "${N_GPU_LAYERS:-0}"
      - "--n-ctx"
      - "${N_CTX:-4096}"
      - "--keep-alive-secs"
      - "${KEEP_ALIVE_SECS:-0}"
      # The daemon refuses to listen on 0.0.0.0 without a token. Set API_KEY
      # below and drop this flag once the port is reachable beyond localhost.
      - "--allow-unauthenticated"
    restart: unless-stopped
