# GPU is the default backend; whole app on one port:
#
#   docker compose up -d          # http://localhost:8090
#
# Requires the NVIDIA Container Toolkit on the host. For a CPU-only host use
# `docker compose -f docker-compose.cpu.yml up -d`.
#
# Put a `.gguf` in `./models` (or set `MODELS_DIR`); the app lists it, and
# downloads from the Hub are written back there. On a network anyone can reach,
# set `API_KEY`.
services:
  nexllama:
    build:
      context: .
      dockerfile: Dockerfile.web.cuda
      args:
        CRATES_MIRROR: ${CRATES_MIRROR:-}
        CUDA_VERSION: ${CUDA_VERSION:-12.6.3}
    image: nexllama/nexllama:web-cuda
    ports:
      - "${PORT:-8090}:8090"
    volumes:
      - "${MODELS_DIR:-./models}:/models"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      NEXLLAMA_API_KEY: ${API_KEY:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
