[workspace]
resolver = "2"
members = [
    "crates/infer-core",
    "crates/infer-daemon",
    "crates/infer-hub",
    "crates/gguf-probe",
]
exclude = [
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Nexllama contributors"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }

[profile.release]
codegen-units = 1
lto = "thin"
