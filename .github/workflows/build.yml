name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    # CUDA is not installed on hosted runners, and the Windows 2025 image's
    # VS 2026 toolchain has a CMake/Ninja link failure in this build. CI
    # validates CPU packaging on the stable Windows 2022 image; the CUDA
    # installers are built locally where the toolkit exists.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install LLVM
        run: choco install llvm --no-progress -y

      - name: Install frontend deps
        run: npm --prefix frontend ci

      - name: Lint
        shell: pwsh
        run: |
          ./scripts/build.ps1 clippy -p infer-core -p infer-daemon -p infer-hub -p gguf-probe --all-targets
          ./scripts/build.ps1 fmt --all -- --check

      - name: Build CPU installer
        shell: pwsh
        run: ./scripts/package.ps1 -Edition full -Backends cpu

      - name: Upload CPU installer
        uses: actions/upload-artifact@v4
        with:
          name: nexllama-nsis-cpu
          path: crates/app/target/release/bundle/nsis/*.exe

  # The daemon ships in a Linux container and the engine is plain Rust, so a
  # green Windows job says nothing about either. This runs the tests, which the
  # Windows job cannot: they need the llama.cpp build, and paying for it twice
  # on the slowest runner buys nothing.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev llvm-dev cmake ninja-build pkg-config libdbus-1-dev

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --all -- --check

  # `crates/app` is excluded from the workspace, so nothing above looks at it —
  # and it is the half that runs with desktop privileges.
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/app

      - name: Install LLVM
        run: choco install llvm --no-progress -y

      # `tauri::generate_context!` reads the built frontend, so the bundle has
      # to exist before the crate will compile.
      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      # `backends/` is produced by package.ps1 and is gitignored. The Tauri
      # resource glob still has to match at compile time, so stage one file.
      - name: Stage resource placeholder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force crates/app/backends/cpu | Out-Null
          Set-Content -Path crates/app/backends/cpu/.placeholder -Value 'CI resource placeholder'

      - name: Clippy
        shell: pwsh
        working-directory: crates/app
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        shell: pwsh
        working-directory: crates/app
        run: cargo test --all-targets

      - name: Format
        shell: pwsh
        working-directory: crates/app
        run: cargo fmt --all -- --check

  # The desktop shell is the half that has to compile on every platform, and a
  # green Windows job says nothing about that.
  linux-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/app

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libfuse2 \
            clang libclang-dev llvm-dev cmake ninja-build pkg-config

      - name: Build installer (cpu)
        run: |
          npm --prefix frontend ci
          ./scripts/package.sh cpu

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nexllama-linux
          path: |
            crates/app/target/release/bundle/deb/*.deb
            crates/app/target/release/bundle/rpm/*.rpm
            crates/app/target/release/bundle/appimage/*.AppImage

  # A dependency with a Known Vulnerability is the kind of thing nobody notices
  # until it is in a release, and `Cargo.lock` pins one every day.
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check GPU image
        run: docker build --check -f Dockerfile.web.cuda .

      - name: Build CPU image
        run: docker build -f Dockerfile.web.cpu -t nexllama/nexllama:web-cpu .

      - name: Smoke test CPU image
        run: |
          docker run --rm -d --name nexllama-smoke -p 8090:8090 nexllama/nexllama:web-cpu
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8090/health
          docker rm -f nexllama-smoke
